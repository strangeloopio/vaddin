<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The VAddin Times</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&display=swap">
<style>
  /* Layout concept: one centred black-and-white column — invocation, masthead,
     headline, photograph plate, the two dates. Nothing else. Single-theme by design. */
  :root{
    --paper:#ffffff;
    --ink:#111111;
    --ink-soft:#555550;
    --rule:#111111;
    --rule-faint:#c9c9c4;
    --display:'Playfair Display', Georgia, 'Times New Roman', serif;
    --body:'Old Standard TT', Georgia, 'Times New Roman', serif;
    --masthead:'Playfair Display', Georgia, 'Times New Roman', serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--body);
    padding-block:clamp(24px,5vw,56px);
    padding-inline:16px;
    -webkit-font-smoothing:antialiased;
  }
  .sheet{
    max-width:720px;
    margin-inline:auto;
    text-align:center;
  }

  .invocation{
    font-size:.82rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    margin:0 0 14px;
  }

  .masthead{
    border-top:1px solid var(--rule);
    border-bottom:3px double var(--rule);
    padding-block:clamp(16px,4vw,28px) clamp(12px,3vw,20px);
  }
  .masthead h1{
    margin:0;
    font-family:var(--masthead);
    font-weight:900;
    font-size:clamp(2.1rem,8vw,4.2rem);
    line-height:1.08;
    letter-spacing:.02em;
    text-wrap:balance;
  }

  .dateline{
    display:flex; justify-content:center; flex-wrap:wrap; column-gap:12px; row-gap:2px;
    border-bottom:1px solid var(--rule);
    padding-block:8px;
    font-size:.78rem;
    letter-spacing:.2em;
    text-transform:uppercase;
  }

  .banner{padding-block:clamp(26px,5vw,40px) clamp(20px,4vw,30px)}
  .eyebrow{
    margin:0 0 12px;
    font-size:.8rem;
    letter-spacing:.44em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .banner h2{
    margin:0;
    font-family:var(--display);
    font-weight:900;
    font-size:clamp(1.9rem,6.4vw,3.6rem);
    line-height:1.08;
    text-transform:uppercase;
    letter-spacing:.02em;
    text-wrap:balance;
  }

  .plate{
    border:1px solid var(--ink);
    padding:8px;
    max-width:440px;
    margin-inline:auto;
  }
  .plate .frame{
    position:relative;
    aspect-ratio:4/5;
    max-width:100%;
    border:1px dashed var(--rule-faint);
    display:grid;
    place-content:center;
    gap:8px;
    padding:16px;
  }
  .plate .frame img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    opacity:0;
  }
  .plate .frame.loaded{border-color:transparent; padding:0}
  .plate .frame.loaded img{opacity:1}
  .plate .frame.loaded .label{visibility:hidden}
  .plate .label{
    font-family:var(--display);
    font-size:.8rem;
    letter-spacing:.26em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }

  .dates{
    margin-top:clamp(28px,5vw,40px);
    border-top:3px double var(--rule);
    border-bottom:3px double var(--rule);
    padding-block:clamp(20px,4vw,28px);
  }
  .dates .grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:start;
  }
  .dates .event + .event{border-left:1px solid var(--rule-faint)}
  .dates .event{padding-inline:14px; min-width:0}
  .dates dt{
    font-size:.72rem;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .dates dd{
    margin:8px 0 0;
    font-family:var(--display);
    font-weight:700;
    font-size:clamp(1.02rem,2.6vw,1.3rem);
    line-height:1.35;
  }
  .dates dd .day{
    display:block;
    font-family:var(--body);
    font-weight:400;
    font-style:italic;
    font-size:.9rem;
    color:var(--ink-soft);
    margin-bottom:3px;
    letter-spacing:.06em;
  }
  .venue{
    margin:clamp(18px,3.5vw,24px) auto 0;
    padding-top:14px;
    border-top:1px solid var(--rule-faint);
    max-width:320px;
    font-size:.74rem;
    letter-spacing:.3em;
    text-transform:uppercase;
    color:var(--ink-soft);
  }
  .venue strong{
    display:block;
    margin-top:6px;
    font-family:var(--display);
    font-weight:700;
    font-size:1.05rem;
    letter-spacing:.24em;
    color:var(--ink);
  }

  @media (max-width:520px){
    .dates .grid{grid-template-columns:1fr; row-gap:20px}
    .dates .event + .event{border-left:0; border-top:1px solid var(--rule-faint); padding-top:20px}
  }
</style>
</head>
<body>
<div class="sheet">

  <p class="invocation">&#2405; Shree Mahaviray Namah &#2405;</p>

  <header class="masthead">
    <h1>The VAddin Times</h1>
  </header>

  <div class="dateline">
    <span>Sunday, 11 October 2026</span>
  </div>

  <section class="banner">
    <p class="eyebrow">Save the Date</p>
    <h2>Vrudhi &amp; Achal to&nbsp;Wed</h2>
  </section>

  <figure style="margin:0">
    <div class="plate">
      <div class="frame">
        <img alt="Vrudhi &amp; Achal" onload="this.parentElement.classList.add('loaded')" onerror="this.style.display='none'" src="photo.jpg">
        <span class="label">Photograph of<br>the Couple</span>
      </div>
    </div>
  </figure>

  <section class="dates">
    <dl class="grid" style="margin:0">
      <div class="event">
        <dt>Pre-Wedding</dt>
        <dd><span class="day">Wednesday</span>24 February 2027</dd>
      </div>
      <div class="event">
        <dt>Wedding</dt>
        <dd><span class="day">Thursday</span>25 February 2027</dd>
      </div>
    </dl>
    <p class="venue">Venue<strong>Club O7, Ahmedabad</strong></p>
  </section>

</div>
</body>
</html>
